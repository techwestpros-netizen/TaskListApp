<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Task List</title>
<style>
body {
    font-family: Arial, sans-serif;
    background-color: #4d148c; /* FedEx purple background */
    color: white;
    padding: 20px;
}
h1 { text-align: center; }
table { width: 100%; border-collapse: collapse; background-color: #fff; color: #000; }
th, td { padding: 10px; border: 1px solid #ccc; text-align: left; }
select { padding: 2px; }
button { margin: 2px; }
.edit-popup {
    display: none;
    position: fixed;
    top: 20%;
    left: 35%;
    width: 30%;
    padding: 20px;
    background: #fff;
    color: #000;
    border: 2px solid #4d148c;
    z-index: 100;
}
.edit-popup textarea, .edit-popup input { width: 100%; }
.edit-popup button { margin-top: 10px; }
</style>
</head>
<body>

<h1>Task List</h1>

<button onclick="showAddTask()">Add Task</button>
<button onclick="exportToExcel()">Download Data</button>

<table id="taskTable">
<thead>
<tr>
    <th>Task</th>
    <th>Date Added</th>
    <th>Assigned To</th>
    <th>Comment</th>
    <th>Status</th>
    <th>Actions</th>
</tr>
</thead>
<tbody></tbody>
</table>

<!-- Add Task Popup -->
<div id="addTaskPopup" class="edit-popup">
<h3>Add Task</h3>
<input type="text" id="taskInput" placeholder="Task"><br><br>
<input type="text" id="assignedInput" placeholder="Assigned To"><br><br>
<textarea id="commentInput" placeholder="Comment"></textarea><br><br>
<button onclick="addTask()">Add</button>
<button onclick="closeAddTask()">Cancel</button>
</div>

<!-- Edit Comment Popup -->
<div id="editPopup" class="edit-popup">
<h3>Edit Comment</h3>
<textarea id="editCommentInput"></textarea><br><br>
<button onclick="saveEdit()">Save</button>
<button onclick="closeEdit()">Cancel</button>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script>
// Firebase config
const firebaseConfig = {
  apiKey: "AIzaSyAYW9gEZOpNjhCGhyXaUbIGDIHThQY1tmo",
  authDomain: "task-list-80827.firebaseapp.com",
  databaseURL: "https://task-list-80827-default-rtdb.firebaseio.com",
  projectId: "task-list-80827",
  storageBucket: "task-list-80827.firebasestorage.app",
  messagingSenderId: "576934957722",
  appId: "1:576934957722:web:c4be19707d3d6257740523"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// Globals
let currentEditId = null;
let oldComment = "";

// Load tasks
function loadTasks() {
    const tbody = document.querySelector("#taskTable tbody");
    tbody.innerHTML = "";
    db.ref('tasks').once('value', snapshot => {
        snapshot.forEach(child => {
            const data = child.val();
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${data.task}</td>
                <td>${data.dateAdded}</td>
                <td>${data.assignedTo || ""}</td>
                <td>${data.comment}</td>
                <td>
                    <select onchange="updateStatus('${child.key}', this)">
                        <option value="Incomplete" ${data.status==="Incomplete"?"selected":""}>Incomplete</option>
                        <option value="Complete" ${data.status==="Complete"?"selected":""}>Complete</option>
                    </select>
                </td>
                <td>
                    <button onclick="openEdit('${child.key}', '${data.comment.replace(/'/g,"\\'")}')">Edit</button>
                    <button onclick="deleteTask('${child.key}')">Delete</button>
                </td>
            `;
            const select = tr.querySelector('select');
            select.style.background = data.status === "Complete" ? "lightgreen" : "salmon";
            tbody.appendChild(tr);
        });
    });
}

// Add Task
function showAddTask(){ document.getElementById('addTaskPopup').style.display='block'; }
function closeAddTask(){ document.getElementById('addTaskPopup').style.display='none'; }
function addTask(){
    const task = document.getElementById('taskInput').value;
    const comment = document.getElementById('commentInput').value;
    const assignedTo = document.getElementById('assignedInput').value;
    if(!task) return alert("Task required");
    const newTask = {
        task,
        comment,
        assignedTo,
        status: "Incomplete",
        dateAdded: new Date().toLocaleString(),
        editHistory: []
    };
    const ref = db.ref('tasks').push();
    ref.set(newTask, ()=>{
        closeAddTask();
        document.getElementById('taskInput').value='';
        document.getElementById('commentInput').value='';
        document.getElementById('assignedInput').value='';
        loadTasks();
    });
}

// Edit
function openEdit(id, comment){
    currentEditId = id;
    oldComment = comment;
    document.getElementById('editCommentInput').value = comment;
    document.getElementById('editPopup').style.display='block';
}
function closeEdit(){ document.getElementById('editPopup').style.display='none'; }
function saveEdit(){
    const newComment = document.getElementById('editCommentInput').value;
    db.ref('tasks/'+currentEditId).once('value', snap=>{
        const data = snap.val();
        if(!data.editHistory) data.editHistory=[];
        if(newComment !== oldComment){
            data.editHistory.push({old: oldComment, new: newComment, time: new Date().toLocaleString()});
            db.ref('tasks/'+currentEditId+'/comment').set(newComment);
            db.ref('tasks/'+currentEditId+'/editHistory').set(data.editHistory);
        }
        closeEdit();
        loadTasks();
    });
}

// Delete
function deleteTask(id){ if(confirm("Delete this task?")) db.ref('tasks/'+id).remove(loadTasks); }

// Status
function updateStatus(id, select){
    const val = select.value;
    select.style.background = val==="Complete"?"lightgreen":"salmon";
    db.ref('tasks/'+id+'/status').set(val);
}

// Export Excel
function exportToExcel(){
    db.ref('tasks').once('value', snapshot=>{
        const data = [];
        snapshot.forEach(snap=>{
            const d = snap.val();
            data.push({
                Task: d.task,
                "Date Added": d.dateAdded,
                "Assigned To": d.assignedTo || "",
                Comment: d.comment,
                Status: d.status
            });
        });
        const ws = XLSX.utils.json_to_sheet(data);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Tasks");
        XLSX.writeFile(wb, "TaskList.xlsx");
    });
}

// Initial load
loadTasks();
</script>

</body>
</html>
